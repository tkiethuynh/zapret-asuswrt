name: Release Zapret Asuswrt-Merlin Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Release
        run: |
          # Prepare target directory structure using the repo's frozen, tested binaries
          mkdir -p zapret-merlin/binaries
          cp -r binaries/linux-arm binaries/linux-arm64 zapret-merlin/binaries/
          
          # Copy our script/config files
          cp install.sh zapret userpage_zapret.asp config.json zapret-merlin/
          
          # Package it
          tar -czf zapret-merlin.tar.gz -C zapret-merlin .
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zapret-merlin.tar.gz
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
